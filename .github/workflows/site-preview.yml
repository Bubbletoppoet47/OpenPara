name: Website preview

# Builds the website from the dev branch and publishes it to the OpenPara-site-preview repository (GitHub Pages there), so changes can be looked at
# before they go live. The live site (openpara.net) keeps coming from main.  Needs the secret PREVIEW_TOKEN: a fine-grained token with
# Contents: read and write on Bubbletoppoet47/OpenPara-site-preview.
on:
  push:
    branches: ["dev"]
    paths: ["docs/**", "tools/build_site.py", "tools/preview_site.py", ".github/workflows/site-preview.yml"]
  workflow_dispatch:

concurrency:
  group: site-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the pages
        run: |
          python3 tools/build_site.py
          python3 tools/preview_site.py docs build_preview

      - name: Check the token
        env:
          PREVIEW_TOKEN: ${{ secrets.PREVIEW_TOKEN }}
        run: |
          if [ -z "$PREVIEW_TOKEN" ]; then echo "::error title=PREVIEW_TOKEN is missing::Add the secret PREVIEW_TOKEN (Settings > Secrets and variables > Actions)."; exit 1; fi

      - name: Get the preview repository
        uses: actions/checkout@v4
        with:
          repository: Bubbletoppoet47/OpenPara-site-preview
          token: ${{ secrets.PREVIEW_TOKEN }}
          path: preview_repo

      - name: Publish
        run: |
          cd preview_repo
          git rm -r -q --ignore-unmatch . > /dev/null
          cp -a ../build_preview/. .
          git add -A
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "OpenPara site preview"
          git config user.email "noreply@users.noreply.github.com"
          git commit -q -m "Preview of dev ${GITHUB_SHA::7}"
          git push
          echo "Preview: https://bubbletoppoet47.github.io/OpenPara-site-preview/"
